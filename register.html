<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Steals & Deals - Register</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>

    <div class="register-container">
        <div class="register-card">
            <img src="images/logo.avif" alt="Local Steals & Deals Logo" class="logo">

            <h1>Create Account</h1>
            <p>Join Local Steals & Deals and start shopping today</p>

            <form id="registerForm">

                <div class="input-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter your full name">
                </div>

                <div class="input-group">
                    <label for="emailAddress">Email</label>
                    <input type="email" id="emailAddress" placeholder="Enter your email">
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Create password">
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm password">
                </div>

                <button type="submit" class="register-btn">Register</button>

                <p class="login-link">
                    Already have an account?
                    <a href="index.html">Login here</a>
                </p>

                <p id="formMessage" class="form-message"></p>

            </form>
        </div>
    </div>

    <script src="js/register.js"></script>
</body>
</html>
